name: Update rulesets and Clash profiles

on:
  schedule:
    #- cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Comma separated categories allowed to shrink a lot (e.g. malw-block). Leave empty normally.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write


concurrency:
  group: update-rulesets-and-profiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/ruleset-builder/requirements.txt
            tools/config-builder/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r tools/ruleset-builder/requirements.txt
          python -m pip install -r tools/config-builder/requirements.txt

      - name: Download Mihomo
        shell: bash
        run: |
          set -euo pipefail

          read -r MIHOMO_VERSION MIHOMO_ASSET MIHOMO_SHA256 < <(python - <<'PY'
          import yaml
          with open('settings/build.yaml', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)
          m = cfg['mihomo']
          print(m['version'], m['asset'], m['sha256'])
          PY
          )

          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_ASSET}"
          archive=/tmp/mihomo.gz
          binary=./.tools-mihomo

          echo "Downloading ${url}"
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -A 'Baidunafter/clash-config' \
            -o "$archive" \
            "$url"

          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$actual_sha256" != "$MIHOMO_SHA256" ]; then
            echo "::error::Mihomo archive SHA256 mismatch"
            echo "Expected: $MIHOMO_SHA256"
            echo "Actual:   $actual_sha256"
            exit 1
          fi

          gzip -dc "$archive" > "$binary"
          chmod +x "$binary"

          echo "Downloaded binary:"
          file "$binary"

          if ! head -c 4 "$binary" | od -An -tx1 | grep -q ' 7f 45 4c 46'; then
            echo "::error::Downloaded Mihomo is not an ELF executable"
            exit 1
          fi

          "$binary" -v

      - name: Share downloaded sources between preflight and build
        run: echo "SOURCE_CACHE_DIR=$RUNNER_TEMP/source-cache" >> "$GITHUB_ENV"

      - name: Check settings
        run: python tools/ruleset-builder/settings_check.py

      - name: Unit tests
        run: python -m unittest discover -s tools/ruleset-builder/tests -v

      - name: Preflight external sources
        run: python tools/ruleset-builder/preflight.py

      - name: Aggregate rulesets
        env:
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink }}
        run: python tools/ruleset-builder/build.py --mihomo ./.tools-mihomo

      - name: Check GitHub PAT
        env:
          CLASH_GITHUB_PAT: ${{ secrets.CLASH_GITHUB_PAT }}
        run: |
          if [ -z "$CLASH_GITHUB_PAT" ]; then
            echo "::error::CLASH_GITHUB_PAT repository/environment secret is missing or empty."
            exit 1
          fi
          echo "CLASH_GITHUB_PAT is available."

      - name: Build final profiles
        env:
          CLASH_GITHUB_PAT: ${{ secrets.CLASH_GITHUB_PAT }}
        run: python tools/config-builder/build_profiles.py

      - name: Validate profiles with Mihomo
        shell: bash
        run: |
          set -euo pipefail
          # The test copies read providers from the freshly generated local files
          # (the remote `main` branch still has the previous generation).
          profiles="$(python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open('settings/profiles.yaml', encoding='utf-8'))
          print(' '.join(n for n, p in cfg['profiles'].items() if p.get('enabled', True)))
          PY
          )"
          for profile in $profiles; do
            out="$RUNNER_TEMP/mihomo-test-${profile%.yaml}"
            python tools/config-builder/make_test_profile.py "$profile" "$out"
            echo "mihomo -t: $profile"
            ./.tools-mihomo -t -d "$out" -f "$out/config.yaml"
          done
          git diff --check

      - name: Routing changes (previous commit vs this build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/before"
          git archive HEAD settings generated | tar -x -C "$RUNNER_TEMP/before"
          {
            echo '### Routing changes'
            echo '```'
            python tools/ruleset-builder/routing_diff.py "$RUNNER_TEMP/before" . --examples 6
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarise changes
        run: python tools/ruleset-builder/report.py --commit-message-file "$RUNNER_TEMP/commit-message.txt"

      - name: Commit changes only when needed
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          # git diff alone ignores untracked files (e.g. a new generated/classical/ file).
          if [ -z "$(git status --porcelain -- generated WARPxUNIVERSAL.yaml WARPxALT.yaml)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated WARPxUNIVERSAL.yaml WARPxALT.yaml
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git pull --rebase
          git push

      - name: Close the failure issue after a successful scheduled run
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --state open --label update-failed --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The scheduled update succeeded: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: Open an issue when the scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create update-failed --color B60205 --description 'Scheduled ruleset update failed' 2>/dev/null || true
          existing="$(gh issue list --state open --label update-failed --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $run_url"
          else
            gh issue create --label update-failed --title 'Scheduled ruleset update failed' \
              --body "The daily update failed, profiles are not being refreshed. Run: $run_url"
          fi

mihomo:
  version: v1.19.34
  asset: mihomo-linux-amd64-compatible-v1.19.34.gz
  sha256: 2763f5b414527f7baf6dc57e3f82f3ab561eedf34bfd7c2f2cde1f7e592efe06

# MALW non-blocking IP mappings are disabled as Mihomo hosts overrides.
# The MALW blocking section is still aggregated into malw-block.
malw:
  publish_host_overrides: false
  # Warn (not fail) when the MALW hosts file has not been updated for this long.
  max_age_days: 45

# Safeguards against upstream files that were renamed, truncated or emptied.
# A category whose size drops by more than max_shrink_percent compared with the
# previous generated/meta/manifest.json fails the build. Accept an intended
# shrink with `build.py --allow-shrink NAME`, the ALLOW_SHRINK env variable
# (workflow_dispatch input) or by listing the name here.
guard:
  max_shrink_percent: 40
  min_previous_size: 50
  allow_shrink: []

# Informational routing checks (generated/meta/conflicts.json, warnings in the log):
# domains of proxied categories that are also in these Russian direct lists.
conflicts:
  direct_lists:
    - {source: roscomvpn, path: category-ru}
    - {source: roscomvpn, path: whitelist}


ordered_rules:
# Telegram connects by IP address (no DNS name), so its IP ranges go first: no
# later rule can claim them before they reach the Telegram group.
- ip: telegram
- RULE-SET,private-ips,DIRECT,no-resolve
- RULE-SET,private-domains,DIRECT
- RULE-SET,user-exclude,DIRECT
- RULE-SET,user-geo-block,Геоблок
- block: category-ads
- block: malw-block
- block: win-spy
- RULE-SET,category-ru,DIRECT
- RULE-SET,whitelist,DIRECT
- RULE-SET,direct-ips,DIRECT,no-resolve
# Android package names of Russian apps (PROCESS-NAME); on other platforms it matches nothing.
- RULE-SET,ru-apps,DIRECT
# IPv6 is off in this profile (settings/core.yaml). A connection made straight to an IPv6
# address (a browser with its own DNS-over-HTTPS, a client that ignores AAAA filtering) would
# leave from another exit IP than the IPv4 connections of the same site, and Google then sees
# one session from two addresses. Rejecting it makes the application fall back to IPv4 at once.
# Telegram's IPv6 ranges (first rule), private and Russian direct ranges are matched earlier.
- IP-CIDR6,::/0,REJECT,no-resolve
- domain: telegram
- DOMAIN-SUFFIX,adserver.twitch.tv,REJECT
- DOMAIN-SUFFIX,ads.twitch.tv,REJECT
- DOMAIN-KEYWORD,twitch-ads,REJECT
- DOMAIN-KEYWORD,amazon-adsystem,REJECT
- domain: twitch-ads
- domain: twitch

# Top-level Mihomo options shared by every profile.
# GUI clients (Clash Verge Rev, FlClash, ...) have their own settings pages and may
# override some of these (ipv6, unified-delay, tcp-concurrent, sniffer).

# IPv6 is off: the IP rule sets are IPv4-only, so IPv6 connections made by address
# (no DNS name) would bypass them. Matches dns.ipv6 in dns.yaml.
ipv6: false

unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# Recovers the domain of connections made by IP (TLS SNI / HTTP Host / QUIC) so domain
# rules still apply, and maps IPs back to the names resolved through fake-ip DNS.
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.lan'
    - '+.local'
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.3gppnetwork'

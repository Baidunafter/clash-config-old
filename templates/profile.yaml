# Every group that a category routes to lists every node (geo, origin, masque), so any node can
# be picked anywhere, for checks too. Saving traffic is done in the category assignment, not by
# hiding nodes: bulk and static traffic is DIRECT (google-bulk, bulk-direct). Only the
# automatic group "🌍 Авто" skips nodes named TEL (traffic limit), so auto-select never lands on one.
proxy-groups:
  - name: Cloudflare
    type: select
    include-all-proxies: true
    proxies:
      - 🔓 Без VPN
      - ⚡️ Авто
      - 🌍 Авто
    filter: "⭐|☁️|🎭"
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/cloudflare-icon.svg
  - name: Relay-сервера
    type: select
    include-all-proxies: true
    proxies:
      - 🔓 Без VPN
      - 🌍 Авто
    filter: "🌍"
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/relay-icon.svg
  - name: 🛸 LOCAL-PROXY
    type: select
    include-all-proxies: true
    proxies:
      - Cloudflare
      - Relay-сервера
      - ⚡️ Авто
      - 🌍 Авто
      - 🔓 Без VPN
    filter: "🌍|⭐|☁️|🎭"
    icon: https://raw.githubusercontent.com/codelabhq/icons/main/proxy-icon.svg
  - name: Обход качества Twitch
    type: select
    include-all-proxies: true
    proxies:
      - Relay-сервера
      - Cloudflare
      - 🌍 Авто
      - ⚡️ Авто
      - 🔓 Без VPN

    icon: https://raw.githubusercontent.com/codelabhq/icons/main/global-icon.svg
  - name: ⚡️ Авто
    type: url-test
    tolerance: 150
    url: *health-url
    expected-status: 204
    interval: *check-interval
    include-all-proxies: true
    filter: "⭐|☁️|🎭"
    hidden: true
  - name: 🌍 Авто
    type: url-test
    tolerance: 150
    url: *health-url
    expected-status: 204
    interval: *check-interval
    include-all-proxies: true
    filter: '^\[🌍( MQ)?\]'
    exclude-filter: "TEL"
    hidden: true
  - name: PROXY
    type: select
    hidden: true
    proxies:
      - Cloudflare
      - 🌍 Авто
  - name: 🔓 Без VPN
    type: select
    hidden: true
    proxies:
      - DIRECT
  - name: ⏭️ Пропуск
    type: select
    hidden: true
    proxies:
      - PASS

